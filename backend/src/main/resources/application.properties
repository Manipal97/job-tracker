server.port=8080

# --- Database: H2 file DB by default (no setup). For MySQL, swap these lines. ---
spring.datasource.url=jdbc:h2:file:./data/jobtracker;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
#spring.datasource.url=jdbc:mysql://localhost:3306/job_tracker?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root

# --- JWT (secret must be 32+ characters; override with env var in production) ---
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiration-ms=86400000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Google OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=profile,email

# --- Follow-up reminder emails (optional). Without MAIL_HOST, reminders are only logged. ---
app.mail-from=${MAIL_FROM:no-reply@jobtracker.local}
app.reminder-cron=${REMINDER_CRON:0 0 8 * * *}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
